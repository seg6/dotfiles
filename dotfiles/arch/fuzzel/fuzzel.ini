[main]
include=~/.config/fuzzel/colors.ini
namespace=fuzzel
font=JetBrainsMono Nerd Font:size=11
prompt=run: 
icons-enabled=no
terminal=kitty
width=44
lines=12
horizontal-pad=14
vertical-pad=10
inner-pad=8
line-height=20
layer=overlay
anchor=center

[border]
width=1

[dmenu]
exit-immediately-if-empty=yes
