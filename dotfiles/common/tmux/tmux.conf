set -g prefix M-Space
set -s escape-time 20
set -g base-index 1
set -g mouse on
set -g set-titles on
set -g set-titles-string "#{?@ws-title,#{@ws-title},#S}:#I:#W"
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
set -g focus-events on
set -g history-limit 50000
set -g extended-keys on
set -g extended-keys-format csi-u

set -g @theme-popup-border "default"
set -g status-style bg=default
set -g status-left-length 50
set -g status-left "[#{?@ws-title,#{@ws-title},#S}] "
set -g status-right "%H:%M"
set -g status-interval 1
set -g window-status-format "#I:#W"
set -g window-status-current-format "#I:#W*"
set -g window-status-separator " "

source-file -q ~/.config/tmux/theme.conf

set -g window-size latest
setw -g aggressive-resize on
setw -g pane-base-index 1
setw -g mode-keys vi
setw -g automatic-rename off
set -g allow-rename off

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "if command -v pbcopy >/dev/null 2>&1; then pbcopy; elif command -v wl-copy >/dev/null 2>&1; then wl-copy; elif command -v xclip >/dev/null 2>&1; then xclip -selection clipboard -in; fi"

unbind -a
bind ? list-keys
bind [ copy-mode
bind ] paste-buffer
bind R source-file ~/.config/tmux/tmux.conf \; display-message "config reloaded"
bind , command-prompt -I "#W" "rename-window '%%'"
bind s run-shell '~/.local/bin/ws scratchpad'
bind Space send-prefix

bind x split-window -h -p 50
bind z split-window -v -p 50
bind q kill-pane

bind -n M-C-h select-pane -L
bind -n M-C-j select-pane -D
bind -n M-C-k select-pane -U
bind -n M-C-l select-pane -R

bind -n M-s display-popup -E -b rounded -S "fg=#{@theme-popup-border}" -w60% -h60% "~/.local/bin/ws"
bind -n M-d display-popup -E -b rounded -S "fg=#{@theme-popup-border}" -w60% -h60% "~/.local/bin/ws kill"
bind -n M-g run-shell '~/.local/bin/ws scratchpad'
bind -n M-b run-shell '~/.local/bin/ws back #{client_name}'
bind -n M-l run-shell '~/.local/bin/ws back #{client_name}'

bind -n M-1 if-shell 'tmux select-window -t 1' '' 'new-window -t 1'
bind -n M-2 if-shell 'tmux select-window -t 2' '' 'new-window -t 2'
bind -n M-3 if-shell 'tmux select-window -t 3' '' 'new-window -t 3'
bind -n M-4 if-shell 'tmux select-window -t 4' '' 'new-window -t 4'
bind -n M-5 if-shell 'tmux select-window -t 5' '' 'new-window -t 5'
bind -n M-6 if-shell 'tmux select-window -t 6' '' 'new-window -t 6'
bind -n M-7 if-shell 'tmux select-window -t 7' '' 'new-window -t 7'
bind -n M-8 if-shell 'tmux select-window -t 8' '' 'new-window -t 8'
bind -n M-9 if-shell 'tmux select-window -t 9' '' 'new-window -t 9'
bind -n M-0 if-shell 'tmux select-window -t 10' '' 'new-window -t 10'

bind -T copy-mode-vi M-1 select-window -t 1
bind -T copy-mode-vi M-2 select-window -t 2
bind -T copy-mode-vi M-3 select-window -t 3
bind -T copy-mode-vi M-4 select-window -t 4
bind -T copy-mode-vi M-5 select-window -t 5
bind -T copy-mode-vi M-6 select-window -t 6
bind -T copy-mode-vi M-7 select-window -t 7
bind -T copy-mode-vi M-8 select-window -t 8
bind -T copy-mode-vi M-9 select-window -t 9
bind -T copy-mode-vi M-0 select-window -t 10
