theme = "generated"

[editor]
mouse = false
line-number = "relative"
auto-format = false
idle-timeout = 250
gutters = ["diff", "diagnostics", "line-numbers", "spacer"]
rainbow-brackets = true

[editor.indent-guides]
render = false
character = "⸽"
skip-levels = 1

[editor.soft-wrap]
enable = true

[editor.lsp]
auto-document-highlight = true

[editor.word-completion]
enable = true
trigger-length = 7

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.statusline]
left = ["mode", "spinner", "file-name"]
right = [
  "diagnostics", "workspace-diagnostics",
  "version-control", "selections", "position",
  "file-encoding", "file-line-ending", "file-type"]

mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

[keys.normal]
"G" = "goto_last_line"
"0" = "goto_line_start"
"$" = "goto_line_end"
"D" = "kill_to_line_end"

[keys.select]
"G" = "goto_last_line"
"0" = "goto_line_start"
"$" = "goto_line_end"
"D" = "kill_to_line_end"
